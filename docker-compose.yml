services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      HEX_STATE_BACKEND: redis
      HEX_REDIS_URL: redis://redis:6379/0
      HEX_REDIS_KEY_PREFIX: hexgame
      HEX_DATABASE_URL: postgresql+psycopg://hexgame:hexgame@postgres:5432/hexgame
      HEX_DATABASE_AUTO_CREATE: "1"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hexgame
      POSTGRES_USER: hexgame
      POSTGRES_PASSWORD: hexgame
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexgame -d hexgame"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
