# Repo-root pyproject — owns only the test configuration.
# The two installable distributions live under client/ and server/:
#
#   pip install -e ./client            # `hexgame` — clients
#   pip install -e ./server[redis,postgres]   # `hexgame-server` — server
#
# Running `pytest` from the repo root resolves both packages via the
# pythonpath entries below, so a full editable install of both isn't required
# for the in-memory tests (the redis/postgres tests still need those extras).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["client/src", "server/src"]
